<body>
<div class="wrap">
<h1>极速开始</h1>
<p>按住 Win+X，再按 I 打开 PowerShell，点击"复制代码"后粘贴到 PowerShell 中运行即可。</p>
<button id="copyBtn">复制代码</button>
<label for="code">PowerShell 代码</label>
<textarea id="code" readonly>param(
    [string[]]$Url = @("https://yzym.lanzoul.com/idFSS4f102eh"),
    [string]$Pwd = "",
    [string]$OutDir = "",
    [int]$Threads = 8,
    [int]$Retry = 6,
    [switch]$ParseOnly,
    [switch]$NoResume
)

$ErrorActionPreference = 'Stop'

$script:Api       = 'https://lanzou.yuyuqaq.cn/api/parse'
$script:UserAgent = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36'
$script:BlockSize = 4194304
$script:KB = 1024
$script:MB = 1048576
$script:GB = 1073741824

try {
    [System.Net.ServicePointManager]::SecurityProtocol = [System.Net.SecurityProtocolType]::Tls12 -bor `
        [System.Net.SecurityProtocolType]::Tls11 -bor [System.Net.SecurityProtocolType]::Tls
    [System.Net.ServicePointManager]::DefaultConnectionLimit = 64
    [System.Net.ServicePointManager]::Expect100Continue = $false
} catch { }

function Format-Size([double]$b) {
    if ($b -ge $script:GB) { return ('{0:F2} GB' -f ($b / $script:GB)) }
    if ($b -ge $script:MB) { return ('{0:F2} MB' -f ($b / $script:MB)) }
    if ($b -ge $script:KB) { return ('{0:F1} KB' -f ($b / $script:KB)) }
    return ('{0} B' -f [long]$b)
}

function Format-Speed([double]$bps) {
    if ($bps -le 0) { return '0 B/s' }
    return (Format-Size $bps) + '/s'
}

function Format-Eta([double]$sec) {
    if ($sec -le 0 -or $sec -gt 359999) { return '' }
    if ($sec -lt 60) { return ('{0:F0} 秒' -f $sec) }
    if ($sec -lt 3600) { return ('{0:F0} 分 {1:F0} 秒' -f [Math]::Floor($sec / 60), ($sec % 60)) }
    return ('{0:F0} 时 {1:F0} 分' -f [Math]::Floor($sec / 3600), [Math]::Floor(($sec % 3600) / 60))
}

function ConvertTo-Bytes([string]$s) {
    if ([string]::IsNullOrWhiteSpace($s)) { return [long]0 }
    $m = [regex]::Match($s, '([0-9]+(?:\.[0-9]+)?)\s*([KMG]?)(?:B)?', 'IgnoreCase')
    if (-not $m.Success) { return [long]0 }
    $v = [double]$m.Groups[1].Value
    switch ($m.Groups[2].Value.ToUpper()) {
        'G' { $v = $v * 1073741824 }
        'M' { $v = $v * 1048576 }
        'K' { $v = $v * 1024 }
    }
    return [long]$v
}

function Clean-Name([string]$s) {
    if ($null -eq $s) { return '' }
    return $s.Trim().TrimEnd('-').Trim()
}

function Fix-SplitName([string]$name) {
    if ($name -match '^(.+)\.([0-9]{3})\.7z$') {
        return ($matches[1] + '.7z.' + $matches[2])
    }
    return $name
}

function ConvertTo-SafeName([string]$name) {
    $n = $name -replace '[\\/:*?"&lt;&gt;|]', '_'
    if ([string]::IsNullOrWhiteSpace($n)) { $n = 'download.bin' }
    return $n.Trim()
}

function Resolve-Lanzou {
    param([string]$Link, [string]$Password = '')

    $json = @{ url = $Link; pwd = $Password } | ConvertTo-Json -Compress
    $bytes = [System.Text.Encoding]::UTF8.GetBytes($json)

    $req = [System.Net.HttpWebRequest]::Create($script:Api)
    $req.Method = 'POST'
    $req.ContentType = 'application/json'
    $req.Accept = 'application/json'
    $req.UserAgent = $script:UserAgent
    $req.Timeout = 20000
    $req.ContentLength = $bytes.Length

    $text = ''
    try {
        $st = $req.GetRequestStream()
        $st.Write($bytes, 0, $bytes.Length)
        $st.Dispose()
        $resp = $req.GetResponse()
        $sr = New-Object System.IO.StreamReader($resp.GetResponseStream(), [System.Text.Encoding]::UTF8)
        $text = $sr.ReadToEnd()
        $sr.Dispose()
        $resp.Dispose()
    } catch {
        $msg = $_.Exception.Message
        try {
            if ($_.Exception.Response) {
                $sr2 = New-Object System.IO.StreamReader($_.Exception.Response.GetResponseStream(), [System.Text.Encoding]::UTF8)
                $body = $sr2.ReadToEnd(); $sr2.Dispose()
                if ($body) { $msg = $body }
            }
        } catch { }
        throw "接口请求失败: $msg"
    }

    try { $j = $text | ConvertFrom-Json }
    catch { throw "解析 API 响应失败: $($text.Substring(0, [Math]::Min(200, $text.Length)))" }

    if ($j.code -ne 0) {
        $m = [string]$j.msg
        if (-not $m) { $m = "code=$($j.code)" }
        throw "解析失败: $m"
    }

    $d = $j.data
    if ($null -eq $d) { throw 'API 未返回 data 字段' }

    $name = Clean-Name ([string]$d.name)
    $name = Fix-SplitName $name
    $direct = [string]$d.downUrl
    if (-not $direct) { $direct = [string]$d.downurl }
    if (-not $name -or -not $direct) {
        throw "API 未返回文件名或直链: $($text.Substring(0, [Math]::Min(200, $text.Length)))"
    }

    return [pscustomobject]@{
        Name      = ConvertTo-SafeName $name
        RawName   = $name
        DirectUrl = $direct
        Referer   = $Link
        Size      = ConvertTo-Bytes ([string]$d.filesize)
    }
}

function Get-RemoteInfo {
    param([string]$Link, [string]$Referer)

    $r = [pscustomobject]@{ Size = [long]0; SupportRange = $false }
    $req = [System.Net.HttpWebRequest]::Create($Link)
    $req.Method = 'GET'
    $req.UserAgent = $script:UserAgent
    if ($Referer) { $req.Referer = $Referer }
    $req.Accept = '*/*'
    $req.Timeout = 20000
    $req.ReadWriteTimeout = 20000
    [void]$req.AddRange(0, 0)

    try {
        $resp = $req.GetResponse()
        $code = [int]$resp.StatusCode
        if ($code -eq 206) {
            $cr = [string]$resp.Headers['Content-Range']
            if ($cr -match '/\s*([0-9]+)') {
                $r.Size = [long]$matches[1]
                $r.SupportRange = $true
            }
        } elseif ($code -eq 200) {

            $cl = [string]$resp.Headers['Content-Length']
            if ($cl) { $r.Size = [long]$cl }
            $r.SupportRange = $false
        }
        $resp.Dispose()
    } catch {
        try { if ($_.Exception.Response) { $_.Exception.Response.Dispose() } } catch { }
    }
    return $r
}

$script:BlockWorker = @'
param(
    [string]$Link, [string]$Referer, [string]$Ua,
    [string]$Path, [long]$Start, [long]$End, [int]$Retry
)

$attempt = 0
$lastErr = ''
while ($attempt -le $Retry) {
    $attempt++
    $fs = $null; $resp = $null; $rs = $null
    try {
        $req = [System.Net.HttpWebRequest]::Create($Link)
        $req.Method = 'GET'
        $req.UserAgent = $Ua
        if ($Referer -ne '') { $req.Referer = $Referer }
        $req.Accept = '*/*'
        $req.Timeout = 30000
        $req.ReadWriteTimeout = 60000
        $req.ServicePoint.ConnectionLimit = 64
        [void]$req.AddRange($Start, $End)

        $resp = $req.GetResponse()
        if ([int]$resp.StatusCode -eq 200 -and [long]$resp.ContentLength -gt ($End - $Start + 1)) {
            $resp.Dispose()
            return '服务器未按 Range 返回, 应改用单线程下载'
        }
        $rs = $resp.GetResponseStream()
        $fs = New-Object System.IO.FileStream($Path, [System.IO.FileMode]::Create, [System.IO.FileAccess]::Write, [System.IO.FileShare]::Read)
        $buf = New-Object byte[] 131072
        while (($n = $rs.Read($buf, 0, $buf.Length)) -gt 0) {
            $fs.Write($buf, 0, $n)
        }
        $fs.Dispose();  $fs = $null
        $rs.Dispose();  $rs = $null
        $resp.Dispose(); $resp = $null
        return ''
    }
    catch {
        $lastErr = $_.Exception.Message
        $status = 0
        try { if ($_.Exception.Response) { $status = [int]$_.Exception.Response.StatusCode } } catch { }
        if ($fs -ne $null) { try { $fs.Dispose() } catch { } }
        if ($rs -ne $null) { try { $rs.Dispose() } catch { } }
        if ($resp -ne $null) { try { $resp.Dispose() } catch { } }
        if ($status -eq 416) { return '' }
        if ($attempt -gt $Retry) { return "重试 $Retry 次仍失败: $lastErr" }
        Start-Sleep -Milliseconds (200 * $attempt)
    }
}
return $lastErr
'@

function Get-BlockLength([int]$Index, [long]$Total, [long]$Block) {
    $s = [long]$Index * $Block
    $rest = $Total - $s
    if ($rest -gt $Block) { return $Block }
    return $rest
}

function Save-Parallel {
    param($Info, [string]$Dest, [long]$Total, [int]$Threads, [int]$Retry, [bool]$Resume)

    $block = [long]$script:BlockSize
    $count = [int][Math]::Ceiling([double]$Total / [double]$block)
    $tmpDir = "$Dest.part.blocks"
    $statePath = "$Dest.part.json"

    $validState = $false
    if ($Resume -and (Test-Path -LiteralPath $statePath)) {
        try {
            $st = Get-Content -LiteralPath $statePath -Raw | ConvertFrom-Json
            if ([long]$st.total -eq $Total -and [long]$st.block -eq $block) { $validState = $true }
        } catch { }
    }
    if (-not $validState) {
        if (Test-Path -LiteralPath $tmpDir) { Remove-Item -LiteralPath $tmpDir -Recurse -Force }
    }
    if (-not (Test-Path -LiteralPath $tmpDir)) { New-Item -ItemType Directory -Path $tmpDir -Force | Out-Null }
    @{ total = $Total; block = $block; url = $Info.DirectUrl } | ConvertTo-Json -Compress |
        Set-Content -LiteralPath $statePath -Encoding ASCII

    $doneBytes = [long]0
    $todo = New-Object System.Collections.Generic.List[int]
    for ($i = 0; $i -lt $count; $i++) {
        $bp = Join-Path $tmpDir "$i.blk"
        $expect = Get-BlockLength $i $Total $block
        $ok = $false
        if (Test-Path -LiteralPath $bp) {
            if ((Get-Item -LiteralPath $bp).Length -eq $expect) { $ok = $true }
            else { Remove-Item -LiteralPath $bp -Force -ErrorAction SilentlyContinue }
        }
        if ($ok) { $doneBytes += $expect } else { $todo.Add($i) | Out-Null }
    }

    $startTime = Get-Date
    $lastTime = $startTime
    $lastBytes = $doneBytes
    $inst = 0.0
    $errors = New-Object System.Collections.Generic.List[string]

    Write-Host ('  共 {0} 块 / {1} 线程, 已续传 {2}' -f $count, $Threads, (Format-Size $doneBytes))

    $pool = $null
    $running = New-Object System.Collections.Generic.List[object]
    $ptr = 0
    try {
        if ($todo.Count -gt 0) {
            $pool = [runspacefactory]::CreateRunspacePool(1, $Threads)
            $pool.Open()

            while ($ptr -lt $todo.Count -or $running.Count -gt 0) {
                while ($ptr -lt $todo.Count -and $running.Count -lt $Threads) {
                    $i = $todo[$ptr]; $ptr++
                    $bp = Join-Path $tmpDir "$i.blk"
                    $s = [long]$i * $block
                    $e = $s + (Get-BlockLength $i $Total $block) - 1

                    $ps = [powershell]::Create()
                    $ps.RunspacePool = $pool
                    [void]$ps.AddScript($script:BlockWorker)
                    [void]$ps.AddParameter('Link', $Info.DirectUrl)
                    [void]$ps.AddParameter('Referer', $Info.Referer)
                    [void]$ps.AddParameter('Ua', $script:UserAgent)
                    [void]$ps.AddParameter('Path', $bp)
                    [void]$ps.AddParameter('Start', $s)
                    [void]$ps.AddParameter('End', $e)
                    [void]$ps.AddParameter('Retry', $Retry)

                    $h = $ps.BeginInvoke()
                    $running.Add([pscustomobject]@{ Ps = $ps; Handle = $h; Index = $i }) | Out-Null
                }

                $still = New-Object System.Collections.Generic.List[object]
                foreach ($j in $running) {
                    if ($j.Handle.IsCompleted) {
                        try {
                            $out = $j.Ps.EndInvoke($j.Handle)
                            $msg = ''
                            if ($out -ne $null -and $out.Count -gt 0) { $msg = [string]$out[0] }
                            if ($msg) { $errors.Add("分块 $($j.Index): $msg") }
                            else { $doneBytes += (Get-BlockLength $j.Index $Total $block) }
                        } catch {
                            $errors.Add("分块 $($j.Index): $($_.Exception.Message)")
                        }
                        try { $j.Ps.Dispose() } catch { }
                    } else {
                        $still.Add($j) | Out-Null
                    }
                }
                $running = $still

                $now = Get-Date
                $cur = $doneBytes
                foreach ($j in $running) {
                    $bp = Join-Path $tmpDir "$($j.Index).blk"
                    $len = [long]0
                    try { $len = (Get-Item -LiteralPath $bp -ErrorAction Stop).Length } catch { $len = 0 }
                    $cap = Get-BlockLength $j.Index $Total $block
                    if ($len -gt $cap) { $len = $cap }
                    $cur += $len
                }
                if ($cur -gt $Total) { $cur = $Total }

                $elapsed = ($now - $startTime).TotalSeconds
                $avg = 0.0
                if ($elapsed -gt 0.15) { $avg = $cur / $elapsed }
                $dt = ($now - $lastTime).TotalSeconds
                if ($dt -ge 0.5) {
                    if ($cur -ge $lastBytes) { $inst = ($cur - $lastBytes) / $dt }
                    $lastTime = $now
                    $lastBytes = $cur
                }

                $pct = 0
                if ($Total -gt 0) { $pct = [int][Math]::Floor($cur * 100 / $Total) }
                if ($pct -gt 100) { $pct = 100 }
                $eta = ''
                if ($Total -gt $cur -and $avg -gt 1024) {
                    $eta = Format-Eta (($Total - $cur) / $avg)
                }
                $status = '{0} / {1} · {2} · 平均 {3}' -f (Format-Size $cur), (Format-Size $Total), (Format-Speed $inst), (Format-Speed $avg)
                if ($eta) { $status += " · 剩余 $eta" }
                Write-Progress -Activity "下载 $($Info.Name)" -Status $status -PercentComplete $pct -Id 1

                if ($running.Count -gt 0) { Start-Sleep -Milliseconds 150 }
            }
        }
    } finally {
        foreach ($j in $running) { try { $j.Ps.Dispose() } catch { } }
        if ($pool -ne $null) { try { $pool.Close(); $pool.Dispose() } catch { } }
        Write-Progress -Activity "下载 $($Info.Name)" -Completed -Id 1
    }

    if ($errors.Count -gt 0) {
        throw ("有 {0} 个分块失败 (已下载部分保留, 重跑可续传):`n{1}" -f $errors.Count, ($errors -join "`n"))
    }

    $part = "$Dest.part"
    if (Test-Path -LiteralPath $part) { Remove-Item -LiteralPath $part -Force }
    $outFs = [System.IO.File]::Create($part)
    try {
        for ($i = 0; $i -lt $count; $i++) {
            $bfs = [System.IO.File]::OpenRead((Join-Path $tmpDir "$i.blk"))
            $bfs.CopyTo($outFs)
            $bfs.Dispose()
        }
    } finally {
        $outFs.Dispose()
    }

    $real = (Get-Item -LiteralPath $part).Length
    if ($real -ne $Total) {
        throw "合并后大小不符: $real / $Total (保留 .part 便于排查)"
    }

    Move-Item -LiteralPath $part -Destination $Dest -Force
    Remove-Item -LiteralPath $tmpDir -Recurse -Force
    Remove-Item -LiteralPath $statePath -Force -ErrorAction SilentlyContinue

    Write-Host ('  完成: {0}' -f (Format-Size $Total)) -ForegroundColor Green
}

function Save-SingleStream {
    param($Info, [string]$Dest, [long]$SizeHint, [bool]$Resume)

    $part = "$Dest.part"
    if (-not $Resume) { Remove-Item -LiteralPath $part -Force -ErrorAction SilentlyContinue }

    $req = [System.Net.HttpWebRequest]::Create($Info.DirectUrl)
    $req.Method = 'GET'
    $req.UserAgent = $script:UserAgent
    if ($Info.Referer) { $req.Referer = $Info.Referer }
    $req.Accept = '*/*'
    $req.Timeout = 30000
    $req.ReadWriteTimeout = 60000

    $resp = $req.GetResponse()
    $total = [long]$resp.ContentLength
    if ($total -le 0) { $total = $SizeHint }

    $rs = $resp.GetResponseStream()
    $fs = [System.IO.File]::Create($part)
    $buf = New-Object byte[] 131072
    $cur = [long]0
    $startTime = Get-Date
    $lastTime = $startTime
    $inst = 0.0

    try {
        while (($n = $rs.Read($buf, 0, $buf.Length)) -gt 0) {
            $fs.Write($buf, 0, $n)
            $cur += $n

            $now = Get-Date
            $dt = ($now - $lastTime).TotalSeconds
            if ($dt -ge 0.5) {
                $inst = $n / $dt
                $lastTime = $now
            }
            $elapsed = ($now - $startTime).TotalSeconds
            $avg = 0.0
            if ($elapsed -gt 0.15) { $avg = $cur / $elapsed }
            $pct = 0
            if ($total -gt 0) { $pct = [int][Math]::Floor($cur * 100 / $total) }
            $status = '{0} / {1} · {2} · 平均 {3}' -f (Format-Size $cur), (Format-Size $total), (Format-Speed $inst), (Format-Speed $avg)
            if ($total -gt $cur -and $avg -gt 1024) {
                $eta = Format-Eta (($total - $cur) / $avg)
                if ($eta) { $status += " · 剩余 $eta" }
            }
            Write-Progress -Activity "下载 $($Info.Name)" -Status $status -PercentComplete $pct -Id 1
        }
    } finally {
        $fs.Dispose()
        $rs.Dispose()
        $resp.Dispose()
        Write-Progress -Activity "下载 $($Info.Name)" -Completed -Id 1
    }

    if ($total -gt 0 -and $cur -ne $total) {
        throw "大小不符: 实收 $cur / 应为 $total"
    }
    Move-Item -LiteralPath $part -Destination $Dest -Force
    Write-Host ('  完成: {0}' -f (Format-Size $cur)) -ForegroundColor Green
}

if (-not $OutDir) {
    $OutDir = [Environment]::GetFolderPath('Desktop')
    if (-not $OutDir) { $OutDir = (Get-Location).Path }
}
if (-not (Test-Path -LiteralPath $OutDir)) {
    New-Item -ItemType Directory -Path $OutDir -Force | Out-Null
}
$OutDir = (Resolve-Path -LiteralPath $OutDir).Path

if ($Threads -lt 1) { $Threads = 1 }
if ($Threads -gt 32) { $Threads = 32 }
if ($Retry -lt 0) { $Retry = 0 }

Write-Host "保存目录: $OutDir"
Write-Host ("线程: {0}    重试: {1}" -f $Threads, $Retry)

$okCount = 0
$failCount = 0

foreach ($link in $Url) {
    $l = ([string]$link).Trim()
    if (-not $l) { continue }

    Write-Host ''
    Write-Host "解析: $l" -ForegroundColor Cyan
    $info = $null
    try {
        $info = Resolve-Lanzou -Link $l -Password $Pwd
    } catch {
        Write-Host "  失败: $($_.Exception.Message)" -ForegroundColor Red
        $failCount++
        continue
    }

    Write-Host "  文件名: $($info.Name)"
    Write-Host "  大小:   $(if ($info.Size -gt 0) { Format-Size $info.Size } else { '未知' })"
    Write-Host "  直链:   $($info.DirectUrl)"

    if ($ParseOnly) { $okCount++; continue }

    $probe = Get-RemoteInfo -Link $info.DirectUrl -Referer $info.Referer
    $size = $probe.Size
    if ($size -le 0) { $size = $info.Size }

    $dest = Join-Path $OutDir $info.Name
    $resume = -not $NoResume

    try {
        if ($probe.SupportRange -and $size -gt 0) {
            Save-Parallel -Info $info -Dest $dest -Total $size -Threads $Threads -Retry $Retry -Resume $resume
        } else {
            Save-SingleStream -Info $info -Dest $dest -SizeHint $size -Resume $resume
        }
        $finalLen = (Get-Item -LiteralPath $dest).Length
        Write-Host "  已保存: $dest ($(Format-Size $finalLen))" -ForegroundColor Green
        Invoke-Item -LiteralPath $dest
        $okCount++
    } catch {
        Write-Host "  下载失败: $($_.Exception.Message)" -ForegroundColor Red
        $failCount++
    }
}

Write-Host ''
Write-Host ("全部结束: 成功 {0} 个, 失败 {1} 个" -f $okCount, $failCount) -ForegroundColor Cyan</textarea>
<button id="downloadBtn" class="download">点击下载 自动下载程序(Specified).exe</button>
</div>
<script>
document.getElementById("copyBtn").onclick = async function () {
    const box = document.getElementById("code");
    const btn = this;
    box.focus();
    box.select();
    await navigator.clipboard.writeText(box.value);
    btn.textContent = "已复制";
    setTimeout(function () { btn.textContent = "复制代码"; }, 1500);
};
document.getElementById("downloadBtn").onclick = function () {
    window.open("https://yzym.lanzoul.com/idFSS4f102eh", "_blank");
};
</script>
