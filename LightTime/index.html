<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>LightTime</title>
  <meta name="description" content="LightTime — 简约时间 · 农历 · 明暗主题">
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <script>
    // 尽早确定主题与偏好，避免首屏闪烁（FOUC）
    (function () {
      try {
        var saved = localStorage.getItem('theme');
        var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');

        var lang = localStorage.getItem('lt-lang') || 'zh-CN';
        document.documentElement.setAttribute('lang', lang);

        var font = localStorage.getItem('lt-font');
        var stack = { segoe: "'Segoe UI', 'Segoe UI Symbol', system-ui, sans-serif", yahei: "'Microsoft YaHei', '微软雅黑', 'PingFang SC', sans-serif", harmony: "'HarmonyOS Sans SC', 'HarmonyOS Sans', 'Microsoft YaHei', sans-serif", comic: "'Comic Sans MS', 'Comic Sans', 'Chalkboard SE', 'Segoe Print', cursive" }[font];
        if (stack) document.documentElement.style.setProperty('--font', stack);

        var themeData = localStorage.getItem('lt-theme');
        var themes = [];
        if (themeData && themeData !== 'none') {
          try {
            var arr = JSON.parse(themeData);
            if (Array.isArray(arr)) themes = arr; else themes = [themeData];
          } catch (e) { themes = [themeData]; }
          themes = themes.filter(function (x) { return x === 'newyear' || x === 'minecraft' || x === '3d'; });
        }
        if (themes.length) document.documentElement.setAttribute('data-decor', themes.join(' '));

        var weightMap = { bold: 700, medium: 500, light: 300, normal: 400 };
        var weight = weightMap[localStorage.getItem('lt-weight')] || 200;
        document.documentElement.style.setProperty('--time-weight', weight);
        document.documentElement.style.setProperty('--italic', localStorage.getItem('lt-italic') === '1' ? 'italic' : 'normal');
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
      try { window.__lt = { lang: localStorage.getItem('lt-lang') || 'zh-CN' }; } catch (e) { window.__lt = { lang: 'zh-CN' }; }
    })();
  </script>
  <style>
    @font-face {
      font-family: 'Monocraft';
      src: url('https://cdn.jsdelivr.net/gh/IdreesInc/Monocraft@main/dist/Monocraft-ttf/Monocraft.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --bg: #fafafa;
      --fg: #111111;
      --muted: #9a9a9a;
      --line: #e5e5e5;
      --font: -apple-system, "SF Pro Display", "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      --time-weight: 200;
      --italic: normal;
      color-scheme: light;
    }
    [data-theme="dark"] {
      --bg: #0a0a0a;
      --fg: #f5f5f5;
      --muted: #555555;
      --line: #262626;
      color-scheme: dark;
    }

    /* 主题（装饰）变量覆盖 —— 与明暗主题独立 */
    html[data-decor~="newyear"] {
      --bg: #7a0f16;
      --fg: #ffe3a0;
      --muted: #e0b06a;
      --line: #a33a3a;
    }
    html[data-decor~="minecraft"] {
      --bg: #0f1a12;
      --fg: #e8f0d8;
      --muted: #6f8a6f;
      --line: #24360f;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--fg);
      font-variant-numeric: tabular-nums;
      transition: background-color .35s ease, color .35s ease;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    .shell {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      padding: clamp(16px, 3vw, 32px);
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      position: relative;
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 18px;
      font-weight: 600;
      letter-spacing: .02em;
    }
    .brand img { width: 26px; height: 26px; display: block; }

    .topbar-actions { display: flex; align-items: center; gap: 10px; }

    .icon-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      border: 1px solid var(--line);
      border-radius: 50%;
      background: transparent;
      color: var(--fg);
      cursor: pointer;
      transition: background-color .25s ease, border-color .25s ease, color .25s ease, transform .15s ease;
    }
    .icon-btn:hover { border-color: var(--muted); }
    .icon-btn:active { transform: scale(.94); }
    .icon-btn:focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; }
    .icon-btn.active { background: var(--fg); color: var(--bg); }

    /* 右下角：全屏 + 设置 */
    .corner-actions {
      position: fixed;
      right: 16px;
      bottom: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 12;
    }

    /* 明暗主题按钮的太阳/月亮切换 */
    [data-theme="light"] .icon-sun { display: block; }
    [data-theme="light"] .icon-moon { display: none; }
    [data-theme="dark"] .icon-sun { display: none; }
    [data-theme="dark"] .icon-moon { display: block; }

    /* 全屏按钮的进入/退出切换 */
    .icon-expand { display: block; }
    .icon-compress { display: none; }
    .is-fullscreen .icon-expand { display: none; }
    .is-fullscreen .icon-compress { display: block; }

    /* 语言下拉 */
    .dropdown-wrap { position: relative; }
    .lang-dropdown {
      position: absolute;
      top: calc(100% + 10px);
      right: 0;
      min-width: 170px;
      padding: 6px;
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 12px;
      box-shadow: 0 10px 32px rgba(0,0,0,.22);
      display: none;
      z-index: 50;
    }
    .lang-dropdown.show { display: block; }
    .lang-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      color: var(--fg);
      white-space: nowrap;
      transition: background .2s;
    }
    .lang-item:hover { background: var(--line); }
    .lang-badge {
      width: 24px;
      height: 24px;
      flex-shrink: 0;
      border-radius: 50%;
      background: var(--fg);
      color: var(--bg);
      font-size: 11px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .lang-name { flex: 1; }
    .lang-check { color: var(--muted); opacity: 0; }
    .lang-item.active .lang-check { opacity: 1; }
    .lang-item.active { background: var(--line); }

    /* 设置面板（自右下角向上展开） */
    .settings-panel {
      position: fixed;
      right: 16px;
      bottom: 96px;
      width: min(300px, calc(100vw - 32px));
      max-height: calc(100vh - 116px);
      overflow-y: auto;
      padding: 18px;
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: 0 18px 48px rgba(0,0,0,.25);
      display: none;
      z-index: 40;
    }
    .settings-panel.show { display: block; }
    .settings-title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 14px;
      letter-spacing: .02em;
    }
    .field-group { margin-bottom: 16px; }
    .field-group:last-child { margin-bottom: 0; }
    .field-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .08em;
      margin-bottom: 8px;
    }
    .opt-list { display: flex; flex-direction: column; gap: 4px; }

    .opt {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 7px 8px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
      transition: background .15s, opacity .15s;
    }
    .opt:hover { background: var(--line); }
    .opt input { position: absolute; opacity: 0; width: 0; height: 0; }
    .chk {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
      border: 1.5px solid var(--muted);
      border-radius: 5px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background .15s, border-color .15s;
    }
    .chk::after {
      content: '';
      width: 9px;
      height: 5px;
      border-left: 2px solid var(--bg);
      border-bottom: 2px solid var(--bg);
      transform: rotate(-45deg) scale(0);
      transition: transform .12s;
    }
    .opt input:checked + .chk { background: var(--fg); border-color: var(--fg); }
    .opt input:checked + .chk::after { transform: rotate(-45deg) scale(1); }
    .opt input:disabled + .chk { opacity: .35; }
    .opt:has(input:disabled) { cursor: not-allowed; opacity: .45; }
    .opt:has(input:disabled):hover { background: transparent; }
    .opt-txt { flex: 1; }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(18px, 3.2vh, 34px);
      text-align: center;
    }
    main.is-3d { perspective: 900px; }

    #scene3d { display: none; width: 100%; height: 42vh; min-height: 220px; }
    body.three3d-active #scene3d { display: block; }
    body.three3d-active .time { display: none; }
    #scene3d canvas { display: block; margin: 0 auto; cursor: grab; }
    #scene3d canvas:active { cursor: grabbing; }

    .time {
      font-size: clamp(4.6rem, 20vw, 16.5rem);
      font-weight: var(--time-weight);
      font-style: var(--italic);
      line-height: 1;
      letter-spacing: -0.02em;
    }
    .date {
      font-size: clamp(1.35rem, 4.5vw, 1.95rem);
      font-weight: 400;
      font-style: var(--italic);
      letter-spacing: .05em;
    }
    .lunar {
      font-size: clamp(1.25rem, 3.8vw, 1.6rem);
      font-style: var(--italic);
      color: var(--muted);
      letter-spacing: .05em;
    }

    .badge {
      font-size: 1.05rem;
      color: var(--muted);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 9px 20px;
      letter-spacing: .03em;
      max-width: 90%;
      line-height: 1.5;
    }
    .badge[hidden] { display: none; }

    /* 主题专属显示效果 */
    html[data-decor~="newyear"] .time {
      color: #ffd76a;
      text-shadow: 0 0 26px rgba(255, 120, 60, .55), 0 2px 0 rgba(120, 20, 10, .6);
    }
    html[data-decor~="newyear"] .badge { color: #f3cd7f; border-color: #c05555; }
    html[data-decor~="newyear"] .brand { color: #ffd76a; }

    html[data-decor~="minecraft"] .time {
      font-family: "Monocraft", "Courier New", monospace;
      font-weight: 400;
      font-size: clamp(4.6rem, 20vw, 16.5rem);
      letter-spacing: 0;
      line-height: 1.05;
      color: #ffffff;
      text-shadow: 3px 3px 0 #000, 6px 6px 0 rgba(0,0,0,.5);
    }

    html[data-decor~="3d"] .time {
      transform: rotateX(var(--rx, -14deg)) rotateY(var(--ry, -18deg));
      transform-style: preserve-3d;
      text-shadow:
        0 1px 0 #8a8ab8,
        0 2px 0 #6a6a9a,
        0 3px 0 #56568a,
        0 4px 0 #42427a,
        0 5px 0 #2e2e6a,
        0 6px 0 #1a1a5a,
        0 8px 16px rgba(0,0,0,.55);
      will-change: transform;
      cursor: grab;
    }
    html[data-decor~="3d"] .time:active { cursor: grabbing; }

    /* 全屏时只保留“退出全屏”，其余（含 Logo）全部隐藏 */
    .is-fullscreen .brand,
    .is-fullscreen #themeToggle,
    .is-fullscreen .dropdown-wrap,
    .is-fullscreen #settingsBtn,
    .is-fullscreen .settings-panel {
      display: none !important;
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <img src="./favicon.svg" alt="" aria-hidden="true">
        <span>LightTime</span>
      </div>
      <div class="topbar-actions">
        <button class="icon-btn" id="themeToggle" type="button" title="切换明暗主题" aria-label="切换明暗主题">
          <svg class="icon icon-sun" viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>
          </svg>
          <svg class="icon icon-moon" viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>
        <div class="dropdown-wrap">
          <button class="icon-btn" id="langToggle" type="button" title="切换语言" aria-label="切换语言">
            <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="9"></circle>
              <ellipse cx="12" cy="12" rx="4" ry="9"></ellipse>
              <ellipse cx="12" cy="12" rx="9" ry="3"></ellipse>
            </svg>
          </button>
          <div class="lang-dropdown" id="langDropdown"></div>
        </div>
      </div>
    </header>

    <main id="main">
      <div class="time" id="time" aria-label="当前时间">
        <span id="timeMain">00:00</span><span id="timeSec">:00</span>
      </div>
      <div id="scene3d" aria-hidden="true"></div>
      <div class="date" id="date">—</div>
      <div class="lunar" id="lunar">—</div>
      <div class="badge" id="badge" hidden></div>
    </main>
  </div>

  <div class="corner-actions">
    <button class="icon-btn" id="settingsBtn" type="button" title="设置" aria-label="设置">
      <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <line x1="4" y1="6" x2="20" y2="6"></line>
        <line x1="4" y1="12" x2="20" y2="12"></line>
        <line x1="4" y1="18" x2="20" y2="18"></line>
        <circle cx="9" cy="6" r="2.2"></circle>
        <circle cx="14" cy="12" r="2.2"></circle>
        <circle cx="8" cy="18" r="2.2"></circle>
      </svg>
    </button>
    <button class="icon-btn" id="fullscreenBtn" type="button" title="全屏" aria-label="全屏">
      <svg class="icon-expand" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"></path>
      </svg>
      <svg class="icon-compress" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M8 3v3a2 2 0 0 1-2 2H3M16 3v3a2 2 0 0 0 2 2h3M8 21v-3a2 2 0 0 0-2-2H3M16 21v-3a2 2 0 0 1 2-2h3"></path>
      </svg>
    </button>
  </div>

  <aside class="settings-panel" id="settingsPanel">
    <div class="settings-title" data-i18n="settings.title">设置</div>

    <div class="field-group">
      <div class="field-label" data-i18n="settings.font">字体</div>
      <div class="opt-list" id="fontList">
        <label class="opt"><input type="checkbox" name="font" value="segoe"><span class="chk"></span><span class="opt-txt">Segoe UI</span></label>
        <label class="opt"><input type="checkbox" name="font" value="yahei"><span class="chk"></span><span class="opt-txt">微软雅黑</span></label>
        <label class="opt"><input type="checkbox" name="font" value="harmony"><span class="chk"></span><span class="opt-txt">HarmonyOS Sans SC</span></label>
        <label class="opt"><input type="checkbox" name="font" value="comic"><span class="chk"></span><span class="opt-txt">Comic Sans MS</span></label>
      </div>
    </div>

    <div class="field-group">
      <div class="field-label" data-i18n="settings.style">样式</div>
      <div class="opt-list" id="styleList">
        <label class="opt"><input type="checkbox" name="style" value="bold"><span class="chk"></span><span class="opt-txt">Bold</span></label>
        <label class="opt"><input type="checkbox" name="style" value="medium"><span class="chk"></span><span class="opt-txt">Medium</span></label>
        <label class="opt"><input type="checkbox" name="style" value="light"><span class="chk"></span><span class="opt-txt">Light</span></label>
        <label class="opt"><input type="checkbox" name="style" value="normal"><span class="chk"></span><span class="opt-txt">Normal</span></label>
        <label class="opt"><input type="checkbox" name="style" value="italic"><span class="chk"></span><span class="opt-txt">Italic</span></label>
      </div>
    </div>

    <div class="field-group">
      <div class="field-label" data-i18n="settings.theme">主题</div>
      <div class="opt-list" id="themeList">
        <label class="opt"><input type="checkbox" name="theme" value="none"><span class="chk"></span><span class="opt-txt" data-i18n="theme.none">无</span></label>
        <label class="opt"><input type="checkbox" name="theme" value="newyear"><span class="chk"></span><span class="opt-txt" data-i18n="theme.newyear">新年</span></label>
        <label class="opt"><input type="checkbox" name="theme" value="minecraft"><span class="chk"></span><span class="opt-txt">Minecraft</span></label>
        <label class="opt"><input type="checkbox" name="theme" value="3d"><span class="chk"></span><span class="opt-txt">3D</span></label>
      </div>
    </div>
  </aside>

  <script defer src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/FontLoader.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/geometries/TextGeometry.js"></script>
  <script src="./lunar.js"></script>
  <script>

        el.addEventListener('pointerdown', function (e) {
          three.dragging = true; three.px = e.clientX; three.py = e.clientY;
          try { el.setPointerCapture(e.pointerId); } catch (err) {}
        });
        el.addEventListener('pointermove', function (e) {
          if (!three.dragging) return;
          three.ry += (e.clientX - three.px) * 0.006;
          three.rx += (e.clientY - three.py) * 0.006;
          three.px = e.clientX; three.py = e.clientY;
          apply3dRotation();
        });
        ['pointerup', 'pointercancel', 'pointerleave'].forEach(function (ev) {
          el.addEventListener(ev, function () { three.dragging = false; });
        });
      }

      function stop3d() {
        if (!three.active) return;
        three.active = false;
        document.body.classList.remove('three3d-active');
        if (three.rafId) cancelAnimationFrame(three.rafId);
        three.font = null;
        var container = document.getElementById('scene3d');
        if (three.renderer) {
          if (three.renderer.domElement && three.renderer.domElement.parentNode === container) {
            container.removeChild(three.renderer.domElement);
          }
          if (three.textMesh) { three.textMesh.geometry.dispose(); three.textMesh.material.dispose(); }
          three.renderer.dispose();
        }
        three.renderer = null; three.scene = null; three.camera = null; three.group = null; three.textMesh = null;
      }

      window.addEventListener('resize', function () {
        if (!three.active || !three.renderer) return;
        var container = document.getElementById('scene3d');
        var w = container.clientWidth, h = container.clientHeight;
        three.camera.aspect = w / h;
        three.camera.updateProjectionMatrix();
        three.renderer.setSize(w, h);
      });

      /* ========== 事件绑定 ========== */
      function closeSettings() {
        settingsPanel.classList.remove('show');
        settingsBtn.classList.remove('active');
      }
      function closeLang() {
        langDropdown.classList.remove('show');
      }

      // 明暗主题
      document.getElementById('themeToggle').addEventListener('click', function () {
        var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        root.setAttribute('data-theme', next);
        try { localStorage.setItem('theme', next); } catch (e) {}
        update3dColor();
      });

      // 全屏
      document.getElementById('fullscreenBtn').addEventListener('click', function () {
        if (document.fullscreenElement) document.exitFullscreen();
        else document.documentElement.requestFullscreen().catch(function () {});
      });
      document.addEventListener('fullscreenchange', function () {
        document.body.classList.toggle('is-fullscreen', !!document.fullscreenElement);
        document.getElementById('fullscreenBtn').title = document.fullscreenElement ? t('fullscreen.exit') : t('fullscreen');
      });

      // 语言下拉：按钮切换开合
      langToggle.addEventListener('click', function (e) {
        e.stopPropagation();
        var willShow = !langDropdown.classList.contains('show');
        closeSettings();
        closeLang();
        if (willShow) langDropdown.classList.add('show');
      });

      // 设置面板：按钮始终打开，不因再次点击而关闭
      settingsBtn.addEventListener('click', function (e) {
        e.stopPropagation();
        settingsPanel.classList.add('show');
        settingsBtn.classList.add('active');
        closeLang();
      });

      // 仅当点击面板/按钮之外时关闭
      document.addEventListener('click', function (e) {
        if (!settingsPanel.contains(e.target) && !settingsBtn.contains(e.target)) closeSettings();
        if (!langDropdown.contains(e.target) && !langToggle.contains(e.target)) closeLang();
      });

      // 字体：单选（点击已选项可取消回到默认）
      document.querySelectorAll('#fontList input').forEach(function (inp) {
        inp.addEventListener('change', function () {
          if (this.checked) {
            curFont = this.value;
            document.querySelectorAll('#fontList input').forEach(function (o) { o.checked = (o.value === curFont); });
            applyFont(curFont);
          } else {
            curFont = '';
            applyFont('');
          }
          try { localStorage.setItem('lt-font', curFont); } catch (e) {}
        });
      });

      // 样式：字重单选 + Italic 独立叠加
      document.querySelectorAll('#styleList input').forEach(function (inp) {
        inp.addEventListener('change', function () {
          if (this.value === 'italic') {
            curItalic = this.checked;
          } else {
            if (this.checked) {
              curWeight = this.value;
              document.querySelectorAll('#styleList input').forEach(function (o) {
                if (o.value !== 'italic' && o.value !== curWeight) o.checked = false;
              });
            } else {
              curWeight = '';
            }
          }
          saveStyle();
          applyStyle();
        });
      });

      // 主题：无=清除；Minecraft=独占；新年/3D 可叠加且互斥于 Minecraft
      document.querySelectorAll('#themeList input').forEach(function (inp) {
        inp.addEventListener('change', function () {
          var v = this.value;
          if (v === 'none') {
            if (this.checked) themes = [];
          } else if (v === 'minecraft') {
            themes = this.checked ? ['minecraft'] : [];
          } else {
            if (this.checked) {
              var mi = themes.indexOf('minecraft');
              if (mi > -1) themes.splice(mi, 1);
              if (themes.indexOf(v) === -1) themes.push(v);
            } else {
              var i = themes.indexOf(v);
              if (i > -1) themes.splice(i, 1);
            }
          }
          saveThemes();
          applyDecor();
          syncSelectors();
        });
      });

      // 3D 拖动
      mainEl.addEventListener('pointerdown', function (e) {
        if (themes.indexOf('3d') === -1 || three.active) return;
        dragging = true; px = e.clientX; py = e.clientY;
        try { mainEl.setPointerCapture(e.pointerId); } catch (err) {}
      });
      mainEl.addEventListener('pointermove', function (e) {
        if (!dragging || themes.indexOf('3d') === -1 || three.active) return;
        ry += (e.clientX - px) * 0.35;
        rx -= (e.clientY - py) * 0.35;
        px = e.clientX; py = e.clientY;
        rx = Math.max(-70, Math.min(70, rx));
        ry = Math.max(-90, Math.min(90, ry));
        paint3d();
      });
      ['pointerup', 'pointercancel', 'pointerleave'].forEach(function (ev) {
        mainEl.addEventListener(ev, function () { dragging = false; });
      });

      /* ========== 初始化 ========== */
      buildLangDropdown();
      applyI18n();
      applyFont(curFont);
      applyStyle();
      applyDecor();
      syncSelectors();

      // Three.js 走 defer 延迟加载，装载完成后若 3D 已选中则补启
      window.addEventListener('load', function () {
        if (themes.indexOf('3d') > -1) start3d();
      });

      tick();
      setInterval(tick, 1000);
      renderBadge();
      setInterval(renderBadge, 60000);
    })();
  </script>
</body>
</html>
